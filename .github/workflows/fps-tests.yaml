name: Third Person Arena logic

on:
  push:
    paths:
      - 'mods/third-person-arena/**'
      - 'tests/third-person-arena.lua'
      - 'tests/tps-weapon.lua'
      - '.github/workflows/fps-tests.yaml'
  pull_request:
    paths:
      - 'mods/third-person-arena/**'
      - 'tests/third-person-arena.lua'
      - 'tests/tps-weapon.lua'
      - '.github/workflows/fps-tests.yaml'

permissions:
  contents: read

jobs:
  combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3
      - run: lua5.3 tests/third-person-arena.lua
      - run: lua5.3 tests/tps-weapon.lua
